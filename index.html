
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Schedule Display</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green-dark:#1a4228;--green:#1d5c34;--green-mid:#2a7048;--green-light:#d4ead9;
  --gold:#f5c800;--gold-dark:#c9a200;
  --white:#ffffff;--off-white:#f7f8f5;
  --gray-1:#e8ebe4;--gray-2:#c8cfc0;--gray-3:#8a9680;
  --text:#1a2418;--text-muted:#4a5442;--text-faint:#8a9680;
  --red:#c0392b;--amber:#e67e00;--teal:#1a7a6e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--off-white);color:var(--text);font-family:'Nunito Sans',sans-serif;overflow:hidden}
.screen{width:100vw;height:100vh;display:grid;grid-template-rows:72px 1fr;grid-template-columns:1fr 360px;grid-template-areas:"topbar topbar" "main sidebar"}

/* TOPBAR */
.topbar{grid-area:topbar;background:var(--green-dark);display:flex;align-items:center;padding:0 32px;gap:20px;position:relative}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--gold)}
.logo-area{display:flex;align-items:center;gap:12px;flex-shrink:0}
.wordmark{display:flex;flex-direction:column;line-height:1}
.wordmark .l1{font-family:'Nunito',sans-serif;font-size:16px;font-weight:900;letter-spacing:.06em;color:var(--white);text-transform:uppercase}
.wordmark .l2{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-top:1px}
.topbar-sep{width:1px;height:28px;background:rgba(255,255,255,0.15)}
.date-pill{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:5px 12px;font-size:13px;font-weight:600;color:rgba(255,255,255,0.75)}
.clock-group{margin-left:auto;display:flex;align-items:baseline;gap:5px}
#clock{font-family:'Nunito',monospace;font-size:36px;font-weight:800;color:var(--white);letter-spacing:-1px;line-height:1}
#clock-ampm{font-size:14px;font-weight:700;color:var(--gold)}

/* STATUS BAR */

/* MAIN */
.main{grid-area:main;display:flex;flex-direction:column;justify-content:center;padding:40px 52px;position:relative;overflow:hidden;background:var(--off-white)}
.main::before{content:'';position:absolute;right:-60px;bottom:-60px;width:420px;height:420px;background:var(--green-light);border-radius:50%;opacity:.35;pointer-events:none}
.mode-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);margin-bottom:14px}
.live-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.event-title-big{font-family:'Nunito',sans-serif;font-size:clamp(30px,4.2vw,62px);font-weight:900;line-height:1.05;letter-spacing:-.5px;color:var(--green-dark);margin-bottom:18px;max-width:840px;position:relative;z-index:1}
.meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:28px;position:relative;z-index:1}
.meta-chip{display:flex;align-items:center;gap:7px;background:var(--white);border:1.5px solid var(--gray-1);border-radius:99px;padding:7px 16px;font-size:14px;font-weight:600;color:var(--text-muted)}
.time-block{position:relative;z-index:1;margin-bottom:28px}
.time-label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px}
.time-value{font-family:'Nunito',sans-serif;font-size:clamp(52px,8vw,104px);font-weight:900;line-height:1;letter-spacing:-3px;transition:color .6s}
.prog-track{margin-top:14px;width:100%;max-width:680px;height:6px;background:var(--gray-1);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width 1s linear,background-color .6s}
.motivational{position:relative;z-index:1;font-size:17px;font-weight:600;font-style:italic;color:var(--text-faint);max-width:600px;line-height:1.55;margin-top:20px;padding-left:16px;border-left:3px solid var(--gold)}
.idle-hero{font-family:'Nunito',sans-serif;font-size:clamp(22px,3vw,44px);font-weight:900;color:var(--green-dark);margin-bottom:10px;position:relative;z-index:1}
.next-teaser{display:inline-flex;align-items:center;gap:14px;background:var(--white);border:2px solid var(--gray-1);border-left:4px solid var(--gold);border-radius:12px;padding:14px 20px;margin-top:18px;max-width:680px;position:relative;z-index:1}
.next-lbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dark);white-space:nowrap}
.next-vdiv{width:1px;height:32px;background:var(--gray-1)}
.next-title{font-size:16px;font-weight:700;color:var(--green-dark);margin-bottom:3px}
.next-when{font-size:13px;font-weight:500;color:var(--text-faint)}
.tmrw-list{display:flex;flex-direction:column;gap:6px;margin-top:20px;max-width:680px;position:relative;z-index:1}
.tmrw-row{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--white);border:1.5px solid var(--gray-1);border-radius:8px}
.tmrw-time{font-size:12px;font-weight:700;color:var(--text-muted);white-space:nowrap;min-width:130px}
.tmrw-name{font-size:13px;font-weight:600;color:var(--green-dark)}
.section-hdr{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;position:relative;z-index:1}

/* SIDEBAR */
.sidebar{grid-area:sidebar;background:var(--green-dark);border-left:3px solid var(--gold);display:flex;flex-direction:column;padding:24px 20px;overflow:hidden;position:relative}
.sidebar::after{content:'';position:absolute;bottom:-80px;right:-80px;width:260px;height:260px;border-radius:50%;border:40px solid rgba(245,200,0,0.06);pointer-events:none}
.sb-label{font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);opacity:.8;margin-bottom:10px}
.sb-divider{border:none;border-top:1px solid rgba(255,255,255,0.08);margin:14px 0}
.today-list{display:flex;flex-direction:column;gap:5px;overflow:hidden}
.today-card{padding:9px 11px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.today-card.current{background:rgba(245,200,0,.1);border-color:rgba(245,200,0,.3)}
.today-card-title{font-size:12px;font-weight:700;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.today-card-time{font-size:10px;font-weight:500;color:rgba(255,255,255,.4)}
.no-events{font-size:12px;color:rgba(255,255,255,.3);padding:8px 0}
</style>
</head>

<script>
// ══════════════════════════════════════
// ICS PARSER — handles RRULE recurring events + EXDATE
// ══════════════════════════════════════
function parseICS(text) {
  const events = [];
  const rawBlocks = text.split('BEGIN:VEVENT');

  for (let i = 1; i < rawBlocks.length; i++) {
    const b = rawBlocks[i];

    const get = k => {
      const m = b.match(new RegExp(k + '[^:\r\n]*:([^\r\n]+(?:\r?\n[ \t][^\r\n]*)*)'));
      return m ? m[1].replace(/\r?\n[ \t]/g, '').trim() : '';
    };

    const clean = s => s.replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\n/g,' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();

    let title   = clean(get('SUMMARY') || '');
    // Normalize names
    if (/club/i.test(title)) title = 'Club';
    if (/affinity/i.test(title)) title = 'Affinity';
    if (/assembly continued|oh\/sh|office hours/i.test(title)) title = 'Office Hours';
    if (/^assembly$/i.test(title)) title = 'Assembly';
    if (/advising/i.test(title)) title = 'Advising';
    if (/grade meeting/i.test(title)) title = 'Grade Meeting';
    if (/^break$/i.test(title)) title = 'Break';
    if (/^lunch$/i.test(title)) title = 'Lunch';
    const startRaw = get('DTSTART');
    const endRaw   = get('DTEND');
    const rrule    = get('RRULE');
    const exdateRaw = get('EXDATE');

    if (!startRaw || !title) continue;

    // Skip non-schedule entries
    const skipWords = ['spring break','memorial day','meeting for test','woca','debate','planning','break/community','arrival','student leadership','bonus block','community meeting'];
    if (skipWords.some(w => title.toLowerCase().includes(w))) continue;

    const parseLocalDT = raw => {
      const m = raw.match(/(\d{8})T(\d{6})/);
      if (!m) return null;
      return {
        date: m[1],
        time: m[2],
        hhmm: m[2].slice(0,2) + ':' + m[2].slice(2,4),
        h: parseInt(m[2].slice(0,2)),
        min: parseInt(m[2].slice(2,4)),
        totalMins: parseInt(m[2].slice(0,2))*60 + parseInt(m[2].slice(2,4))
      };
    };

    const start = parseLocalDT(startRaw);
    const end   = endRaw ? parseLocalDT(endRaw) : null;
    if (!start) continue;

    // Parse EXDATE list
    const exdates = new Set();
    if (exdateRaw) {
      const matches = exdateRaw.matchAll(/(\d{8})T(\d{6})/g);
      for (const m of matches) exdates.add(m[1] + 'T' + m[2]);
    }
    // Also check all EXDATE lines
    const allExdates = [...b.matchAll(/EXDATE[^:]*:([^\r\n]+)/g)];
    for (const ex of allExdates) {
      const mms = ex[1].matchAll(/(\d{8})T(\d{6})/g);
      for (const m of mms) exdates.add(m[1] + 'T' + m[2]);
    }

    // Parse RRULE
    const bydayM = rrule.match(/BYDAY=([^;]+)/);
    const untilM = rrule.match(/UNTIL=(\d{8})/);

    const dayMap = {MO:1,TU:2,WE:3,TH:4,FR:5};
    const byday = bydayM ? bydayM[1].split(',').map(d => dayMap[d]).filter(Boolean) : [];
    const until = untilM ? untilM[1] : '29991231';

    if (byday.length > 0) {
      // Recurring weekly event — store once per day-of-week, with until + exdates
      for (const dow of byday) {
        events.push({ title, dow, start: start.hhmm, end: end ? end.hhmm : '', until, exdates, startDate: start.date });
      }
    } else {
      // Single occurrence — get dow from date
      const dt = new Date(+start.date.slice(0,4), +start.date.slice(4,6)-1, +start.date.slice(6,8));
      const dow = dt.getDay(); // 0=Sun
      if (dow >= 1 && dow <= 5) {
        events.push({ title, dow, start: start.hhmm, end: end ? end.hhmm : '', until, exdates, startDate: start.date, single: true, singleDate: start.date });
      }
    }
  }

  return events;
}

// Build schedule for a given date from parsed events
function getScheduleForDate(events, date) {
  const dow = date.getDay(); // 1=Mon...5=Fri
  if (dow === 0 || dow === 6) return [];

  const dateStr = date.getFullYear().toString() +
    String(date.getMonth()+1).padStart(2,'0') +
    String(date.getDate()).padStart(2,'0');

  const todayEvents = events.filter(e => {
    if (e.dow !== dow) return false;
    if (e.until < dateStr) return false;
    if (e.startDate > dateStr) return false;
    if (e.single && e.singleDate !== dateStr) return false;
    // Check exdate
    const exKey = dateStr + 'T' + e.start.replace(':','') + '00';
    if (e.exdates && e.exdates.has(exKey)) return false;
    return true;
  });

  return todayEvents.sort((a,b) => a.start.localeCompare(b.start));
}

let lastPool = null, curMsg = '';
function pickMsg(pool) {
  if (pool !== lastPool) { curMsg = pool[Math.floor(Math.random()*pool.length)]; lastPool = pool; }
  return curMsg;
}

// ══════════════════════════════════════
// HELPERS
// ══════════════════════════════════════
function toMins(hhmm) { const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function nowMins() { const n=new Date(); return n.getHours()*60+n.getMinutes()+n.getSeconds()/60; }
function fmtSec(s) {
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=Math.floor(s%60);
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  return `${m}:${String(ss).padStart(2,'0')}`;
}
function fmtTime12(hhmm) {
  const [h,m]=hhmm.split(':').map(Number);
  return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nextSchoolDay(date) {
  const d = new Date(date);
  do { d.setDate(d.getDate()+1); } while (d.getDay()===0||d.getDay()===6);
  return d;
}
function colorForMins(m) {
  if(m<5)  return {c:'var(--red)',   pool:MSG.ending};
  if(m<15) return {c:'var(--amber)', pool:MSG.soon};
  if(m<35) return {c:'var(--teal)',  pool:MSG.midway};
  return         {c:'var(--green)',  pool:MSG.early};
}

// ══════════════════════════════════════
// CLOCK
// ══════════════════════════════════════
function updateClock() {
  const n=new Date(),h=n.getHours(),m=n.getMinutes(),s=n.getSeconds(),h12=h%12||12;
  document.getElementById('clock').textContent=`${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.getElementById('clock-ampm').textContent=h<12?'AM':'PM';
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('date-display').textContent=`${days[n.getDay()]}  ·  ${months[n.getMonth()]} ${n.getDate()}, ${n.getFullYear()}`;
}

// ══════════════════════════════════════
// SIDEBAR
// ══════════════════════════════════════
function renderSidebar(events) {
  const now = new Date();
  const dow = now.getDay();
  const isWeekend = dow===0||dow===6;
  const nextDay = nextSchoolDay(now);
  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  document.getElementById('today-sb-label').textContent = isWeekend ? 'Weekend' : "Today";
  document.getElementById('tmrw-sb-label').textContent = DAY_NAMES[nextDay.getDay()];

  const renderList = (elId, date) => {
    const el = document.getElementById(elId);
    const schedule = getScheduleForDate(events, date);
    const isToday = date.toDateString() === now.toDateString();
    const nm = nowMins();
    if (!schedule.length) { el.innerHTML = '<div class="no-events">No school</div>'; return; }
    el.innerHTML = schedule.map(e => {
      const isCur = isToday && nm >= toMins(e.start) && nm < toMins(e.end);
      const isPast = isToday && nm >= toMins(e.end);
      return `<div class="today-card ${isCur?'current':''}" style="${isPast?'opacity:0.32':''}">
        <div class="today-card-title">${esc(e.title)}</div>
        <div class="today-card-time">${fmtTime12(e.start)} – ${fmtTime12(e.end)}</div>
      </div>`;
    }).join('');
  };

  renderList('today-list', now);
  renderList('tomorrow-list', nextDay);
}

// MAIN AREA
// ══════════════════════════════════════
function renderMain(events) {
  const now = new Date();
  const nm = nowMins();
  const area = document.getElementById('main-area');
  const dow = now.getDay();
  const isWeekend = dow===0||dow===6;

  if (isWeekend) {
    const nextDay = nextSchoolDay(now);
    const nextSched = getScheduleForDate(events, nextDay);
    const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    let tmrwHtml = '';
    if (nextSched.length) {
      tmrwHtml = `<div class="section-hdr" style="margin-top:20px">${DAY_NAMES[nextDay.getDay()]}</div>
        <div class="tmrw-list">
          ${nextSched.map(e=>`<div class="tmrw-row">
            <div class="tmrw-time">${fmtTime12(e.start)} – ${fmtTime12(e.end)}</div>
            <div class="tmrw-name">${esc(e.title)}</div>
          </div>`).join('')}
        </div>`;
    }
    area.innerHTML = `
      <div class="mode-label"><span class="live-dot" style="background:var(--gray-3)"></span><span style="color:var(--text-faint)">Weekend</span></div>
      <div class="idle-hero">No school today.</div>
      ${tmrwHtml}
      <div class="motivational" style="margin-top:22px">${esc(pickMsg(MSG.weekend))}</div>`;
    return;
  }

  const todaySchedule = getScheduleForDate(events, now);

  // Find active block
  const active = todaySchedule.find(e => nm >= toMins(e.start) && nm < toMins(e.end)) || null;

  if (active) {
    const rem   = Math.max(0, (toMins(active.end) - nm) * 60);
    const total = (toMins(active.end) - toMins(active.start)) * 60;
    const pct   = Math.min(100, ((total-rem)/total)*100);
    const {c, pool} = colorForMins(rem/60);
    area.innerHTML = `
      <div class="mode-label"><span class="live-dot" style="background:var(--green-mid)"></span><span style="color:var(--green-mid)">Now</span></div>
      <div class="event-title-big">${esc(active.title)}</div>
      <div class="meta-row">
        <div class="meta-chip">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5l2 1.5"/></svg>
          ${fmtTime12(active.start)} – ${fmtTime12(active.end)}
        </div>
      </div>
      <div class="time-block">
        <div class="time-label">Time Remaining</div>
        <div class="time-value" style="color:${c}">${fmtSec(rem)}</div>
        <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${c}"></div></div>
      </div>
      <div class="motivational">${esc(pickMsg(pool))}</div>`;
    return;
  }

  // Idle
  const isAfter = nm >= 15*60;
  const pool = isAfter ? MSG.closing : MSG.idle;

  const nextBlock = todaySchedule.find(e => toMins(e.start) > nm);
  let nextHtml = '';
  if (nextBlock) {
    const diff = (toMins(nextBlock.start) - nm) * 60;
    const when = diff < 3600 ? `in ${Math.round(diff/60)} min` : `at ${fmtTime12(nextBlock.start)}`;
    nextHtml = `<div class="next-teaser">
      <span class="next-lbl">Up next</span>
      <div class="next-vdiv"></div>
      <div>
        <div class="next-title">${esc(nextBlock.title)}</div>
        <div class="next-when">${when}</div>
      </div>
    </div>`;
  }

  const nextDay = nextSchoolDay(now);
  const tmrwSched = getScheduleForDate(events, nextDay);
  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  let tmrwHtml = '';
  if (tmrwSched.length && isAfter) {
    tmrwHtml = `<div class="section-hdr" style="margin-top:24px">${DAY_NAMES[nextDay.getDay()]}</div>
      <div class="tmrw-list">
        ${tmrwSched.map(e=>`<div class="tmrw-row">
          <div class="tmrw-time">${fmtTime12(e.start)} – ${fmtTime12(e.end)}</div>
          <div class="tmrw-name">${esc(e.title)}</div>
        </div>`).join('')}
      </div>`;
  }

  area.innerHTML = `
    <div class="mode-label"><span class="live-dot" style="background:var(--gray-3)"></span><span style="color:var(--text-faint)">${isAfter?'After School':'Between Blocks'}</span></div>
    <div class="idle-hero">${isAfter?'No more blocks today.':'No block in session right now.'}</div>
    ${nextHtml}
    ${tmrwHtml}
    <div class="motivational" style="margin-top:22px">${esc(pickMsg(pool))}</div>`;
}
